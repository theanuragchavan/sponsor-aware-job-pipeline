# Render blueprint.
#
# One service. FastAPI serves the API and the built UI from the same origin, so
# there is no CORS surface, one URL to share, and half as much to break.
#
# Docker rather than the native Python runtime: the front end needs Node to
# build, and whether a given Python runtime image ships Node is not something to
# discover from a failed deploy. The Dockerfile pins both.
services:
  - type: web
    name: resolve
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_MODE
        value: demo
      - key: RATE_LIMIT_PER_MIN
        value: "20"
      - key: MAX_LOG_ENTRIES
        value: "5000"
